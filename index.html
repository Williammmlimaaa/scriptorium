<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scriptorium</title>
  <!-- Google Fonts para Tipografia Vintage -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       VARIAVEIS E ESTILOS GLOBAIS - PALETA DE CORES PERGAMINHO E VINTAGE
       ========================================================================== */
    :root {
      --bg-dark: #120c08;
      --paper-base: #f3e5ab;
      --paper-dark: #d2b48c;
      --paper-aged: #e6c894;
      --ink-black: #2b1e16;
      --ink-brown: #3d2314;
      --gold-primary: #d4af37;
      --gold-dark: #aa7c11;
      --gold-bright: #ffd700;
      --burgundy: #6b1d2f;
      --leather: #4a2511;
      --border-ornate: #8b5a2b;
      --shadow-soft: rgba(0, 0, 0, 0.4);
      --shadow-heavy: rgba(0, 0, 0, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at center, rgba(30, 18, 10, 0.8) 0%, rgba(10, 5, 2, 0.98) 100%),
        url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134-7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43 -7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3z' fill='%3C/svg%3E");
      color: var(--ink-black);
      font-family: 'IM Fell English', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding: 20px 10px;
    }

    input, textarea, p, h1, h2, h3, h4, span {
      user-select: text;
    }

    /* Scrollbar Vintage */
    ::-webkit-scrollbar {
      width: 12px;
    }
    ::-webkit-scrollbar-track {
      background: var(--leather);
      border: 1px solid var(--gold-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--burgundy);
      border: 1px solid var(--gold-primary);
      border-radius: 2px;
    }

    /* Navegação Superior */
    .nav-header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 25px;
      margin-bottom: 25px;
      background: linear-gradient(180deg, #3d2010 0%, #201007 100%);
      border: 2px solid var(--gold-primary);
      box-shadow: 0 5px 15px var(--shadow-heavy), inset 0 0 10px rgba(212, 175, 55, 0.3);
      border-radius: 4px;
      position: relative;
      z-index: 100;
    }

    .brand-title {
      font-family: 'Cinzel Decorative', serif;
      color: var(--gold-bright);
      font-size: 1.5rem;
      text-shadow: 2px 2px 4px #000;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .nav-btn {
      background: linear-gradient(180deg, #5c1827 0%, #3a0d17 100%);
      color: var(--gold-primary);
      border: 1px solid var(--gold-primary);
      padding: 8px 18px;
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      border-radius: 2px;
    }

    .nav-btn:hover, .nav-btn.active {
      background: linear-gradient(180deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
      color: #1a0d00;
      box-shadow: 0 0 10px var(--gold-primary);
    }

    /* Container das Páginas */
    .page-container {
      width: 100%;
      max-width: 1100px;
      min-height: 80vh;
      display: none;
    }

    .page-container.active-page {
      display: flex;
      flex-direction: column;
      animation: fadeInPage 0.5s ease;
    }

    @keyframes fadeInPage {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Moldura de Livro Vintage */
    .book-frame {
      width: 100%;
      background-color: var(--paper-base);
      background-image: 
        radial-gradient(ellipse at center, rgba(255,255,255,0.4) 0%, rgba(210,180,140,0.6) 100%),
        url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
      border: 12px solid #2d180c;
      outline: 3px solid var(--gold-primary);
      outline-offset: -8px;
      box-shadow: 0 0 0 15px #1a0d06, 0 20px 40px var(--shadow-heavy), inset 0 0 100px rgba(80, 50, 20, 0.5);
      position: relative;
      padding: 40px;
      box-sizing: border-box;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
    }

    /* Cantoneiras */
    .corner-ornament {
      position: absolute;
      width: 50px;
      height: 50px;
      pointer-events: none;
      z-index: 10;
    }
    .corner-top-left { top: 5px; left: 5px; border-top: 4px double var(--gold-dark); border-left: 4px double var(--gold-dark); }
    .corner-top-right { top: 5px; right: 5px; border-top: 4px double var(--gold-dark); border-right: 4px double var(--gold-dark); }
    .corner-bottom-left { bottom: 5px; left: 5px; border-bottom: 4px double var(--gold-dark); border-left: 4px double var(--gold-dark); }
    .corner-bottom-right { bottom: 5px; right: 5px; border-bottom: 4px double var(--gold-dark); border-right: 4px double var(--gold-dark); }

    .ornamental-divider {
      text-align: center;
      margin: 20px 0;
      color: var(--burgundy);
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    .ornamental-divider::before, .ornamental-divider::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--burgundy), transparent);
    }

    /* HOME */
    #home-page .book-frame {
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 75vh;
    }

    .home-title-box {
      border: 3px double var(--burgundy);
      padding: 40px 60px;
      background: rgba(245, 233, 200, 0.6);
      margin-bottom: 30px;
    }

    .home-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 3.2rem;
      color: var(--burgundy);
    }

    .home-buttons-container {
      display: flex;
      gap: 30px;
      justify-content: center;
    }

    .vintage-main-btn {
      background: linear-gradient(180deg, #4a1521 0%, #2b0a13 100%);
      color: var(--gold-bright);
      border: 2px solid var(--gold-primary);
      padding: 18px 40px;
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      border-radius: 4px;
    }

    .vintage-main-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 15px var(--gold-primary);
    }

    /* FORMULÁRIO DE CRIAÇÃO */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .vintage-label {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: var(--burgundy);
      font-size: 1.1rem;
    }

    .vintage-input, .vintage-textarea {
      background: rgba(255, 252, 240, 0.85);
      border: 2px solid var(--border-ornate);
      padding: 12px 16px;
      font-family: 'IM Fell English', serif;
      font-size: 1.1rem;
      color: var(--ink-black);
      border-radius: 3px;
    }

    .vintage-textarea {
      min-height: 180px;
      resize: vertical;
    }

    .image-upload-wrapper {
      border: 2px dashed var(--border-ornate);
      padding: 20px;
      text-align: center;
      background: rgba(240, 225, 195, 0.4);
      cursor: pointer;
    }

    .image-preview {
      max-width: 100%;
      max-height: 250px;
      border: 4px double var(--leather);
      margin-top: 15px;
      display: none;
    }

    .chapters-section {
      background: rgba(230, 205, 160, 0.3);
      border: 1px solid var(--border-ornate);
      padding: 20px;
      margin-top: 10px;
    }

    .chapter-card {
      background: rgba(255, 252, 242, 0.9);
      border: 1px solid var(--border-ornate);
      padding: 18px;
      margin-bottom: 15px;
      position: relative;
    }

    .btn-remove-chapter {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--burgundy);
      color: white;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
    }

    .action-btn-secondary {
      background: linear-gradient(180deg, #8b5a2b 0%, #5c3a1a 100%);
      color: var(--gold-bright);
      border: 1px solid var(--gold-primary);
      padding: 10px 20px;
      font-family: 'Cinzel', serif;
      cursor: pointer;
    }

    .save-book-btn {
      background: linear-gradient(180deg, #1e4620 0%, #0d260f 100%);
      color: #d4f0d5;
      border: 2px solid #3e8e43;
      padding: 16px 36px;
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* PÁGINA OBRAS: ESTANTE DE LIVROS */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }

    .book-card-item {
      background: linear-gradient(180deg, #2d180c 0%, #1a0d06 100%);
      border: 2px solid var(--gold-dark);
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 5px 15px var(--shadow-heavy);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--paper-base);
      transition: transform 0.3s;
    }

    .book-card-item:hover {
      transform: translateY(-5px);
      border-color: var(--gold-bright);
    }

    .book-card-title {
      font-family: 'Cinzel Decorative', serif;
      color: var(--gold-bright);
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .book-card-author {
      font-style: italic;
      color: var(--paper-dark);
      margin-bottom: 15px;
    }

    .book-card-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-read-book {
      flex: 2;
      background: linear-gradient(180deg, #6b1d2f 0%, #3d0e19 100%);
      color: var(--gold-bright);
      border: 1px solid var(--gold-primary);
      padding: 10px;
      font-family: 'Cinzel', serif;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-edit-book, .btn-delete-book {
      flex: 1;
      background: var(--leather);
      color: var(--gold-bright);
      border: 1px solid var(--gold-dark);
      cursor: pointer;
      font-family: 'Cinzel', serif;
    }

    .btn-delete-book { background: #5a1212; }

    /* PÁGINA LEITURA EXCLUSIVA EM TELA CHEIA */
    .reader-page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px double var(--burgundy);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .back-btn {
      background: var(--burgundy);
      color: var(--gold-bright);
      border: 1px solid var(--gold-primary);
      padding: 8px 18px;
      font-family: 'Cinzel', serif;
      cursor: pointer;
    }

    .reader-book-title {
      font-family: 'Cinzel Decorative', serif;
      color: var(--burgundy);
      font-size: 2.2rem;
      text-align: center;
    }

    .reader-book-author {
      text-align: center;
      font-style: italic;
      color: var(--ink-brown);
      margin-top: 5px;
      margin-bottom: 20px;
    }

    .reader-cover-image {
      max-width: 320px;
      max-height: 400px;
      object-fit: contain;
      margin: 0 auto 25px auto;
      display: block;
      border: 6px double var(--leather);
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    .chapter-tabs {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid var(--border-ornate);
      margin-bottom: 25px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .chapter-tab {
      background: rgba(210, 180, 140, 0.4);
      border: 1px solid var(--border-ornate);
      padding: 10px 20px;
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .chapter-tab.active {
      background: var(--burgundy);
      color: var(--gold-bright);
      border-color: var(--gold-primary);
      font-weight: bold;
    }

    .reader-content-text {
      font-size: 1.2rem;
      line-height: 1.9;
      color: var(--ink-black);
      text-align: justify;
      white-space: pre-wrap;
      padding: 10px 20px;
    }

    .first-letter-cap::first-letter {
      font-family: 'UnifrakturMaguntia', serif;
      font-size: 4rem;
      float: left;
      line-height: 0.8;
      padding-top: 4px;
      padding-right: 10px;
      color: var(--burgundy);
    }

    /* Toast */
    .vintage-toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #1a0a03;
      color: var(--gold-bright);
      border: 2px solid var(--gold-primary);
      padding: 15px 25px;
      font-family: 'Cinzel', serif;
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- NAVEGAÇÃO SUPERIOR -->
  <nav class="nav-header">
    <div class="brand-title" onclick="switchPage('home')">Scriptorium</div>
    <div class="nav-buttons">
      <button class="nav-btn active" id="nav-home" onclick="switchPage('home')">Início</button>
      <button class="nav-btn" id="nav-criacao" onclick="switchPage('criacao')">Criação</button>
      <button class="nav-btn" id="nav-obras" onclick="switchPage('obras')">Obras</button>
    </div>
  </nav>

  <!-- PÁGINA 1: HOME PAGE -->
  <main id="home-page" class="page-container active-page">
    <div class="book-frame">
      <div class="corner-ornament corner-top-left"></div>
      <div class="corner-ornament corner-top-right"></div>
      <div class="corner-ornament corner-bottom-left"></div>
      <div class="corner-ornament corner-bottom-right"></div>

      <div class="home-title-box">
        <h1 class="home-title">Scriptorium</h1>
        <div class="ornamental-divider">❦ ════════ ❦</div>
      </div>

      <div class="home-buttons-container">
        <button class="vintage-main-btn" onclick="switchPage('criacao')">Criação</button>
        <button class="vintage-main-btn" onclick="switchPage('obras')">Obras</button>
      </div>
    </div>
  </main>

  <!-- PÁGINA 2: CRIAÇÃO DE LIVROS -->
  <main id="criacao-page" class="page-container">
    <div class="book-frame">
      <div class="corner-ornament corner-top-left"></div>
      <div class="corner-ornament corner-top-right"></div>
      <div class="corner-ornament corner-bottom-left"></div>
      <div class="corner-ornament corner-bottom-right"></div>

      <h2 style="font-family: 'Cinzel Decorative', serif; color: var(--burgundy); text-align: center; font-size: 2rem;" id="editor-main-title">
        Ateliê de Escrita
      </h2>
      <div class="ornamental-divider">☙ ❦ ❧</div>

      <form id="book-form" onsubmit="handleSaveBook(event)">
        <input type="hidden" id="edit-book-id" value="">

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
          <div class="form-group">
            <label class="vintage-label">❖ Título da Obra *</label>
            <input type="text" id="book-title" class="vintage-input" placeholder="Ex: Guardiãs Estelares" required>
          </div>
          <div class="form-group">
            <label class="vintage-label">❖ Autor / Pseudônimo</label>
            <input type="text" id="book-author" class="vintage-input" placeholder="Ex: Guardiã Mãe">
          </div>
        </div>

        <div class="form-group">
          <label class="vintage-label">❖ Ilustração de Capa (Opcional)</label>
          <div class="image-upload-wrapper" onclick="document.getElementById('book-image-input').click()">
            <p style="font-style: italic; color: var(--ink-brown);">Clique para carregar uma imagem do dispositivo</p>
            <input type="file" id="book-image-input" accept="image/*" style="display: none;" onchange="handleImagePreview(event)">
            <img id="image-preview" class="image-preview" alt="Pré-visualização">
          </div>
        </div>

        <div class="form-group">
          <label class="vintage-label">❖ Formato da Obra</label>
          <div style="display: flex; gap: 20px; margin-top: 5px;">
            <label style="cursor: pointer; font-weight: bold;"><input type="radio" name="structure-type" value="single" checked onchange="toggleStructureType()"> Texto Único</label>
            <label style="cursor: pointer; font-weight: bold;"><input type="radio" name="structure-type" value="chapters" onchange="toggleStructureType()"> Dividido em Capítulos</label>
          </div>
        </div>

        <div id="single-text-container" class="form-group">
          <label class="vintage-label">❖ Conteúdo Principal</label>
          <textarea id="single-content" class="vintage-textarea" placeholder="Escreva sua história aqui..."></textarea>
        </div>

        <div id="chapters-container" class="chapters-section" style="display: none;">
          <div class="vintage-label" style="margin-bottom: 15px;">❖ Capítulos da Obra</div>
          <div id="chapters-list"></div>
          <button type="button" class="action-btn-secondary" onclick="addChapterInput()">+ Adicionar Capítulo</button>
        </div>

        <div style="margin-top: 30px; display: flex; justify-content: flex-end; gap: 15px;">
          <button type="button" class="action-btn-secondary" onclick="resetForm(); switchPage('obras');">Cancelar</button>
          <button type="submit" class="save-book-btn">🖋 Salvar Obra</button>
        </div>
      </form>
    </div>
  </main>

  <!-- PÁGINA 3: OBRAS (GALERIA/ESTANTE) -->
  <main id="obras-page" class="page-container">
    <div class="book-frame">
      <div class="corner-ornament corner-top-left"></div>
      <div class="corner-ornament corner-top-right"></div>
      <div class="corner-ornament corner-bottom-left"></div>
      <div class="corner-ornament corner-bottom-right"></div>

      <h2 style="font-family: 'Cinzel Decorative', serif; color: var(--burgundy); text-align: center; font-size: 2rem;">
        Biblioteca de Obras
      </h2>
      <div class="ornamental-divider">❦ ════════ ❦</div>

      <div id="bookshelf-grid" class="books-grid">
        <!-- Cartões de livros injetados aqui -->
      </div>
    </div>
  </main>

  <!-- PÁGINA DE LEITURA DEDICADA EM TELA CHEIA -->
  <main id="leitura-page" class="page-container">
    <div class="book-frame">
      <div class="corner-ornament corner-top-left"></div>
      <div class="corner-ornament corner-top-right"></div>
      <div class="corner-ornament corner-bottom-left"></div>
      <div class="corner-ornament corner-bottom-right"></div>

      <div class="reader-page-header">
        <button class="back-btn" onclick="switchPage('obras')">⬅ Voltar às Obras</button>
        <div>
          <button class="back-btn" style="background: var(--leather);" id="btn-edit-reading" onclick="">✎ Editar</button>
        </div>
      </div>

      <h1 class="reader-book-title" id="read-title">Título da Obra</h1>
      <div class="reader-book-author" id="read-author">Por Autor</div>

      <img id="read-cover" class="reader-cover-image" src="" alt="Capa da Obra" style="display: none;">

      <!-- Abas para capítulos se houver -->
      <div id="reader-chapter-tabs" class="chapter-tabs" style="display: none;"></div>

      <!-- Texto de Leitura -->
      <div class="reader-content-text first-letter-cap" id="read-body-text"></div>
    </div>
  </main>

  <!-- TOAST NOTIFICAÇÃO -->
  <div id="toast" class="vintage-toast">
    <span id="toast-message">Obra salva com sucesso!</span>
  </div>

  <script>
    let books = [];
    let currentBookId = null;
    let currentChapterIdx = 0;
    let currentBase64Image = "";

    document.addEventListener("DOMContentLoaded", () => {
      loadBooks();
      
      // Se não houver obras gravadas no navegador, inicializa com os capítulos abaixo:
      if (books.length === 0) {
        createSampleBook();
      }
      
      renderBookshelf();
    });

    function switchPage(pageId) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${pageId}`);
      if (activeNav) activeNav.classList.add('active');

      document.querySelectorAll('.page-container').forEach(page => page.classList.remove('active-page'));
      const targetPage = document.getElementById(`${pageId}-page`);
      if (targetPage) targetPage.classList.add('active-page');

      if (pageId === 'obras') renderBookshelf();
    }

    function loadBooks() {
      const stored = localStorage.getItem('scriptorium_books');
      if (stored) {
        try { books = JSON.parse(stored); } catch(e) { books = []; }
      }
    }

    function saveBooks() {
      localStorage.setItem('scriptorium_books', JSON.stringify(books));
    }

    /* ==========================================================================
       SUA OBRA PRINCIPAL PERMANENTE

Bruna limpou as lágrimas, olhou para as suas fiéis amigas, Nayra e Carolina, e depois para o céu estrelado do submundo. Pirolina havia partido, mas o sacrifício de seu amor fraternal havia dado ao trio de guardiãs, e ao seu novo aliado Kaelen, a chance de um novo amanhecer. O universo estava, finalmente, salvo.
 ` 
          }
        ]
      }];
      saveBooks();
    }

    // CRIAÇÃO E EDIÇÃO
    function toggleStructureType() {
      const isChapters = document.querySelector('input[name="structure-type"]:checked').value === 'chapters';
      document.getElementById('single-text-container').style.display = isChapters ? 'none' : 'flex';
      document.getElementById('chapters-container').style.display = isChapters ? 'block' : 'none';
      if (isChapters && document.querySelectorAll('.chapter-card').length === 0) addChapterInput();
    }

    let chapterCounter = 0;
    function addChapterInput(title = '', content = '') {
      chapterCounter++;
      const list = document.getElementById('chapters-list');
      const div = document.createElement('div');
      div.className = 'chapter-card';
      div.id = `chap-${chapterCounter}`;
      div.innerHTML = `
        <button type="button" class="btn-remove-chapter" onclick="document.getElementById('chap-${chapterCounter}').remove()">×</button>
        <div class="form-group">
          <label class="vintage-label">Título do Capítulo</label>
          <input type="text" class="vintage-input chap-title" value="${title}" placeholder="Ex: Capítulo ${list.children.length + 1}">
        </div>
        <div class="form-group">
          <label class="vintage-label">Conteúdo do Capítulo</label>
          <textarea class="vintage-textarea chap-content">${content}</textarea>
        </div>
      `;
      list.appendChild(div);
    }

    function handleImagePreview(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          currentBase64Image = evt.target.result;
          const img = document.getElementById('image-preview');
          img.src = currentBase64Image;
          img.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    function handleSaveBook(e) {
      e.preventDefault();
      const editId = document.getElementById('edit-book-id').value;
      const title = document.getElementById('book-title').value.trim();
      const author = document.getElementById('book-author').value.trim() || 'Autor Anônimo';
      const isChapters = document.querySelector('input[name="structure-type"]:checked').value === 'chapters';

      let singleContent = "";
      let chapters = [];

      if (isChapters) {
        document.querySelectorAll('.chapter-card').forEach((card, idx) => {
          chapters.push({
            title: card.querySelector('.chap-title').value.trim() || `Capítulo ${idx + 1}`,
            content: card.querySelector('.chap-content').value
          });
        });
      } else {
        singleContent = document.getElementById('single-content').value;
      }

      if (editId) {
        const idx = books.findIndex(b => b.id === editId);
        if (idx !== -1) {
          books[idx] = { ...books[idx], title, author, image: currentBase64Image || books[idx].image, hasChapters: isChapters, content: singleContent, chapters };
        }
      } else {
        books.unshift({
          id: 'book_' + Date.now(),
          title, author, image: currentBase64Image, hasChapters: isChapters, content: singleContent, chapters
        });
      }

      saveBooks();
      resetForm();
      switchPage('obras');
      showToast("Obra salva no Scriptorium!");
    }

    function resetForm() {
      document.getElementById('book-form').reset();
      document.getElementById('edit-book-id').value = "";
      document.getElementById('editor-main-title').innerText = "Ateliê de Escrita";
      document.getElementById('image-preview').style.display = 'none';
      document.getElementById('chapters-list').innerHTML = '';
      currentBase64Image = "";
      toggleStructureType();
    }

    // ESTANTE DE OBRAS
    function renderBookshelf() {
      const grid = document.getElementById('bookshelf-grid');
      grid.innerHTML = '';

      if (books.length === 0) {
        grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: var(--ink-brown);">Nenhuma obra salva ainda.</p>';
        return;
      }

      books.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card-item';
        card.innerHTML = `
          <div>
            <div class="book-card-title">${book.title}</div>
            <div class="book-card-author">Por ${book.author}</div>
            <p style="font-size: 0.9rem; color: #d2b48c;">${book.hasChapters ? book.chapters.length + ' Capítulo(s)' : 'Manuscrito Único'}</p>
          </div>
          <div class="book-card-actions">
            <button class="btn-read-book" onclick="openReader('${book.id}')">📖 Ler</button>
            <button class="btn-edit-book" onclick="editBook('${book.id}')">✎ Edit</button>
            <button class="btn-delete-book" onclick="deleteBook('${book.id}')">🗑</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // LEITURA EM NOVA PÁGINA
    function openReader(id) {
      currentBookId = id;
      currentChapterIdx = 0;
      const book = books.find(b => b.id === id);
      if (!book) return;

      document.getElementById('read-title').innerText = book.title;
      document.getElementById('read-author').innerText = `Por ${book.author}`;
      document.getElementById('btn-edit-reading').onclick = () => editBook(book.id);

      const coverImg = document.getElementById('read-cover');
      if (book.image) {
        coverImg.src = book.image;
        coverImg.style.display = 'block';
      } else {
        coverImg.style.display = 'none';
      }

      const tabs = document.getElementById('reader-chapter-tabs');
      if (book.hasChapters && book.chapters.length > 0) {
        tabs.style.display = 'flex';
        renderReaderTabs(book);
        showChapterText(book, 0);
      } else {
        tabs.style.display = 'none';
        document.getElementById('read-body-text').innerText = book.content || '(Sem texto)';
      }

      switchPage('leitura');
    }

    function renderReaderTabs(book) {
      const tabs = document.getElementById('reader-chapter-tabs');
      tabs.innerHTML = '';
      book.chapters.forEach((chap, idx) => {
        const btn = document.createElement('button');
        btn.className = `chapter-tab ${idx === currentChapterIdx ? 'active' : ''}`;
        btn.innerText = chap.title;
        btn.onclick = () => {
          currentChapterIdx = idx;
          renderReaderTabs(book);
          showChapterText(book, idx);
        };
        tabs.appendChild(btn);
      });
    }

    function showChapterText(book, idx) {
      document.getElementById('read-body-text').innerText = book.chapters[idx]?.content || '(Capítulo sem texto)';
    }

    function editBook(id) {
      const book = books.find(b => b.id === id);
      if (!book) return;

      resetForm();
      document.getElementById('edit-book-id').value = book.id;
      document.getElementById('book-title').value = book.title;
      document.getElementById('book-author').value = book.author;
      document.getElementById('editor-main-title').innerText = "Editar Obra";

      if (book.image) {
        currentBase64Image = book.image;
        document.getElementById('image-preview').src = book.image;
        document.getElementById('image-preview').style.display = 'block';
      }

      if (book.hasChapters) {
        document.querySelectorAll('input[name="structure-type"]')[1].checked = true;
        toggleStructureType();
        document.getElementById('chapters-list').innerHTML = '';
        book.chapters.forEach(ch => addChapterInput(ch.title, ch.content));
      } else {
        document.querySelectorAll('input[name="structure-type"]')[0].checked = true;
        toggleStructureType();
        document.getElementById('single-content').value = book.content || '';
      }

      switchPage('criacao');
    }

    function deleteBook(id) {
      if (confirm('Deseja excluir esta obra permanentemente?')) {
        books = books.filter(b => b.id !== id);
        saveBooks();
        renderBookshelf();
        showToast("Obra removida!");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3000);
    }
  </script>
</body>
</html>
